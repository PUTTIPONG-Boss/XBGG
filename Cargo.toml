[workspace]
resolver = "2"
members = ["crates/xbgg-core", "crates/xbgg"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image decoding and rendering are painfully slow unoptimized; keep our own
# code debuggable but optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
